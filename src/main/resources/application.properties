spring.application.name=backend
server.port=8081

# Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/slotum
spring.datasource.username=postgres
spring.datasource.password=root

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Hibernate
spring.jpa.hibernate.ddl-auto=none

# JWT signing key. Generate once per environment with `docs/generate-jwt-secret.ps1`.
# The app fails on startup if JWT_SECRET is missing or left as CHANGE_ME.
app.jwt.secret=${JWT_SECRET:CHANGE_ME}
app.jwt.accessTtl=PT15M
