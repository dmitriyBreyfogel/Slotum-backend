databaseChangeLog:
  - changeSet:
      id: 006-allow-free-slots-without-customer
      author: dmitriyBreyfogel
      changes:
        - dropNotNullConstraint:
            tableName: slots
            columnName: customer_id
            columnDataType: bigint

  - changeSet:
      id: 007-create-slot-booking-requests
      author: dmitriyBreyfogel
      changes:
        - createTable:
            tableName: slot_booking_requests
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: slot_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: varchar(1024)
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: decided_at
                  type: timestamp
        - addForeignKeyConstraint:
            baseTableName: slot_booking_requests
            baseColumnNames: slot_id
            referencedTableName: slots
            referencedColumnNames: id
            constraintName: fk_slot_booking_requests_slot
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: slot_booking_requests
            baseColumnNames: customer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_slot_booking_requests_customer
            onDelete: RESTRICT
        - createIndex:
            tableName: slot_booking_requests
            indexName: idx_slot_booking_requests_slot_id
            columns:
              - column:
                  name: slot_id
        - createIndex:
            tableName: slot_booking_requests
            indexName: idx_slot_booking_requests_customer_id
            columns:
              - column:
                  name: customer_id
        - createIndex:
            tableName: slot_booking_requests
            indexName: idx_slot_booking_requests_status
            columns:
              - column:
                  name: status
