databaseChangeLog:
  - changeSet:
      id: 006-allow-free-appointments-without-customer
      author: dmitriyBreyfogel
      changes:
        - dropNotNullConstraint:
            tableName: appointments
            columnName: customer_id
            columnDataType: bigint

  - changeSet:
      id: 007-create-appointment-requests
      author: dmitriyBreyfogel
      changes:
        - createTable:
            tableName: appointment_requests
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: appointment_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: varchar(1024)
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: decided_at
                  type: timestamp
        - addForeignKeyConstraint:
            baseTableName: appointment_requests
            baseColumnNames: appointment_id
            referencedTableName: appointments
            referencedColumnNames: id
            constraintName: fk_appointment_requests_appointment
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: appointment_requests
            baseColumnNames: customer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_appointment_requests_customer
            onDelete: RESTRICT
        - createIndex:
            tableName: appointment_requests
            indexName: idx_appointment_requests_appointment_id
            columns:
              - column:
                  name: appointment_id
        - createIndex:
            tableName: appointment_requests
            indexName: idx_appointment_requests_customer_id
            columns:
              - column:
                  name: customer_id
        - createIndex:
            tableName: appointment_requests
            indexName: idx_appointment_requests_status
            columns:
              - column:
                  name: status
